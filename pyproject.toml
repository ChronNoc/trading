[project]
name = "mnq-bot"
version = "0.1.0"
description = "MNQ order-flow trading assistant scaffold."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
    "opencv-python-headless>=4.10,<5",
    "pyarrow>=16,<23",
    "pytest>=8.0,<9",
    "pytest-qt>=4.4,<5",
]
transcribe = [
    "faster-whisper>=1.1,<2",
]
frames = [
    "opencv-python-headless>=4.10,<5",
]
gui = [
    "PySide6>=6.7,<7",
]
bookmap = [
    "websockets>=12,<16",
]
market = [
    "pyarrow>=16,<23",
    "websockets>=12,<16",
]
ml = [
    "joblib>=1.3,<2",
    "scikit-learn>=1.4,<2",
    "xgboost>=2,<4",
]

[tool.setuptools.packages.find]
include = ["app*", "bookmap_addon*", "tools*", "video_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
