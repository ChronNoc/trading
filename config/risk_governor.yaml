# Lucid-fitted risk governor (app/risk/lucid_governor.py, docs/RISK_GOVERNOR.md).
#
# PAPER ONLY. It never routes an order and never touches LIVE, which stays locked by
# config/production_config.yaml and app/execution/live_gate.py.
#
# Every number below is a FRACTION OF THE ACCOUNT PROFILE'S OWN LIMITS (its max-loss limit
# and profit target, from config/prop_profiles/*.yaml). None was tuned from backtest results,
# so none can be adjusted to make a result look better. Change them only when Lucid's rules
# change or you consciously want more or less caution.
#
# The generic engine (app/risk/limits.py, sizing.py, kill_switch.py and the paper executor's
# own caps) stays underneath as the outer guard. The governor only ever ADDS restrictions: the
# stricter of the two always wins. A typo in this file is an error, never a silent default.
enabled: true

# --- survival: derived from the Max Loss Limit (an end-of-day trailing floor) ---------------
# The day may lose this share of the buffer above the floor AT THE START OF THE DAY. Because
# the budget is a share of what is left, a string of worst-case days only shrinks the buffer
# geometrically; it cannot reach the floor (only a gap beyond a stop could).
day_loss_fraction: 0.25
# One trade may use at most 1/N of the day's loss budget ... (the 4% cap below is what binds at
# normal buffers; N only matters as the buffer shrinks. N=2 keeps one contract of the strategy's
# typical 40-60 tick stop affordable all the way down to the retire threshold, so an account
# can never sit "active" but frozen.)
trades_per_day_budget: 2
# ... and never more than this share of the whole max-loss limit.
max_trade_risk_fraction_of_mll: 0.04
# Flatten and lock the day when equity is this close to the floor (absorbs gaps and slippage).
hard_stop_buffer_fraction: 0.10
# Stop the account when less than this share of the max-loss limit is left above the floor:
# too little room to survive ordinary variance. The paper account is then "retired".
retire_buffer_fraction: 0.30

# --- consistency: derived from the ACCOUNT PROFILE's single-day rule (evaluation only) -------
# Lucid's LucidFlex evaluation allows no single day more than 40% of total profit (50% only with
# a paid add-on). The governor stops for the day at (that share - this cushion) of the profit
# target: 30% = $375 on the 25K account, so even a pass of exactly the target keeps the best day
# 10 points inside the rule. If the profile's share changes, the cap follows it.
consistency_cushion: 0.10

# --- behaviour ---------------------------------------------------------------------------------
max_entries_per_day: 8
max_losing_streak: 3
cooldown_after_loss_seconds: 300
min_seconds_between_entries: 120
# New York time. Lucid auto-closes at 16:45 and a late flat is not a breach, but the governor
# is flat before that anyway.
entry_window_start: "09:35"
entry_window_end: "16:15"
flat_time: "16:40"

# --- trade quality: derived from COSTS, not from results ---------------------------------------
# (target - round-trip costs) / (stop + round-trip costs) must be at least this. A 6-tick target
# on MNQ already loses about 75% of itself to commission and slippage; it can never pay.
min_net_reward_risk: 1.0

# --- microscalping: Lucid prohibits more than 50% of profit from trades held <= 5 seconds ------
micro_hold_seconds: 5
micro_profit_share_limit: 0.30

# --- size only scales on evidence ----------------------------------------------------------------
# One contract until the bot's own closed trades PROVE a positive expectancy (at least
# edge_min_trades trades, a 95% lower bound above zero, a real profit factor). A refuted
# strategy is held to one contract rather than stopped, so evidence keeps flowing.
contracts_without_proof: 1
contracts_when_proven: 3
edge_window_trades: 200
edge_min_trades: 100
edge_min_profit_factor: 1.2
