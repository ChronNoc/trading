# User-controlled production configuration.
#
# live_enabled / live_mode: LIVE trading master switch. Ships FALSE and only a
# human editing this file may ever change it - generated code never writes this
# file. Even when true, arming LIVE additionally requires every requirement in
# app/execution/live_gate.py (validation sample, demo soak, resolved prop rules,
# typed confirmation, second confirmation, ...). Arming never survives restart.
live_enabled: false
live_mode: false

# autonomous_enabled: when true, the backend proposes SHADOW-ONLY autonomous
# research candidates (a bounded, deduplicated grid) so the Autonomous
# Intelligence page reflects real state. Proposal only - it never runs gates,
# trains, promotes, trades, or touches the broker, and carries no runtime
# authority. Requires an app restart to take effect.
autonomous_enabled: true

# autonomous_training_enabled: when true, the autonomous cycle ALSO runs the
# OFFLINE_TRAINED gate - heavy offline model training (rebuilds datasets from
# raw and walk-forward-validates). It defaults OFF because training must never
# compete with live capture; enable it for a deliberate research run (e.g.
# overnight when not capturing). Bounded to one candidate per cycle. Still
# shadow-only: no model is ever loaded, approved, or traded.
autonomous_training_enabled: false

# paper_momentum_setup_enabled: when true, the PAPER engine also evaluates the
# optional momentum-continuation setup (momentum-v1) beside the canonical
# order-flow plan. It never replaces the canonical plan, uses the same risk
# gates and the same LIVE lockout, and its simulated trades are labeled
# momentum-v1 in the ledger. Requires an app restart to take effect.
paper_momentum_setup_enabled: true

# paper_strategy_profile: which threshold profile the PAPER engine evaluates.
#   canonical - the honest, deterministic, RTH-only order-flow strategy
#               (90-contract blocks, 400 absorption, CVD >= 25). Only this
#               profile's results describe the real strategy.
#   relaxed   - a RESEARCH profile with lower thresholds and NO RTH gate, so
#               setups form on thin books and overnight and produce labeled
#               outcomes for per-session model training. Its trades are NOT the
#               canonical strategy and carry no profitability meaning; the GUI
#               marks the mode [RELAXED]. LIVE stays locked in either profile.
# Requires an app restart to take effect.
paper_strategy_profile: relaxed

# paper_instrument: which contract's dollar multiplier the PAPER P&L uses.
#   MNQ - Micro E-mini Nasdaq, $2/point ($0.50/tick). The account/risk profile
#         is sized for this.
#   NQ  - E-mini Nasdaq, $20/point ($5/tick). 10x the dollars-per-point of MNQ:
#         every profit AND loss is 10x larger for the same price move. WARNING:
#         on the LucidFlex 25K profile ($1,000 max drawdown) a single NQ stop
#         can consume most/all of the drawdown and fail the evaluation. Prices
#         are identical to MNQ; only the multiplier changes. Restart to apply.
paper_instrument: MNQ

# Dynamic stop management for the live PAPER engine (0 disables each).
# These REDUCE risk on trades that move in your favour; they do NOT increase
# position size (size is still set by the initial stop). "Bigger trades with
# less risk" honestly means: once a trade works, the stop moves to break-even
# so it can no longer lose, then trails to lock in profit.
#   break_even_trigger: after price moves this many ticks in favour, move the
#                       stop to entry + lock ticks (trade can no longer lose).
#   trail: after this many favourable ticks, keep the stop this many ticks
#          behind the best price seen.
# Daily activity caps for the PAPER engine. 0 = UNLIMITED. Currently unlimited
# for the LEARNING STAGE: the setup fires ~1,500 candidates/session and we want
# the maximum number of completed setups to reach the >=100-setup evidence
# threshold as fast as possible. The account drawdown limit ($1,000) still acts
# as a natural floor. IMPORTANT: for a real prop EVALUATION, restore sane caps
# (e.g. entries 3-5, losses 3) - unlimited trading fails real evals. Restart to
# apply.
paper_max_entries_per_day: 0
paper_max_losses_per_day: 0

paper_break_even_trigger_ticks: 8    # +2.0 pts in favour -> stop to ~break-even
paper_break_even_lock_ticks: 2       # lock +0.5 pt so a break-even exit is not a loss
paper_trail_activation_ticks: 16     # +4.0 pts in favour -> start trailing (middle ground)
paper_trail_distance_ticks: 10       # trail 2.5 pts behind the best price

# paper_fixed_contracts / paper_max_risk_per_trade_usd: fixed-size PAPER sizing.
# This is a PER-TRADE risk cap, NOT a daily loss cap (daily caps stay the
# unlimited paper_max_entries_per_day / paper_max_losses_per_day above).
# When paper_fixed_contracts > 0, this is the CEILING on contracts per setup
# (still capped by the account's hard max_contracts ceiling) instead of the
# dynamic 1%-account/3-trades risk sizing. The strategy's real, evidence-derived
# stop is never replaced or invented: if that real stop would risk more than
# paper_max_risk_per_trade_usd at the full ceiling, the position is sized DOWN
# to the largest contract count that fits the cap (the cap is never relaxed).
# Only if a single contract already exceeds the cap is the stop genuinely too
# wide, and the trade is rejected (reason: stop_exceeds_fixed_risk_cap). Set
# paper_fixed_contracts: 0 to fall back to dynamic risk sizing. Restart to apply.
#
# Sizing math (simulation only - delayed data, LIVE locked): the momentum stop
# sits ~57 ticks away = ~$28.7 risk/contract, so 4 contracts is ~$115. The cap
# is set to 130 so the intended 4-unit MNQ size fits at typical stops; unusually
# wide stops still size DOWN to stay within the cap (that guardrail is kept).
paper_fixed_contracts: 4
paper_max_risk_per_trade_usd: 130

# paper_ml_decision_policy_enabled: when true, the PAPER engine consults the
# observe-only shadow model's most recent scored probability (see
# app/machine_learning/shadow_predictor.py) and may VETO a heuristic-accepted
# setup if the model's success probability is low (conservative veto-only
# policy; the model can never accept a heuristic-rejected setup). Ships
# FALSE: with no approved/SCORING model, or with this flag off, every
# decision is the unchanged heuristic-only outcome (decision_source =
# "HEURISTIC"/"FALLBACK"). Still PAPER-ONLY; never touches live broker
# routing or live_enabled/live_mode. Requires an app restart to take effect.
paper_ml_decision_policy_enabled: false
