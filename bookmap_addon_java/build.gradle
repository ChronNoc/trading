plugins {
    id "java"
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

group = "com.mnq"
version = "0.1.0"

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

ext {
    bookmapApiVersion = "7.6.0.20"
}

configurations {
    bookmapApi
}

dependencies {
    bookmapApi "com.bookmap.api:api-core:${bookmapApiVersion}"
    bookmapApi "com.bookmap.api:api-simplified:${bookmapApiVersion}"
}

def installedBookmapLibDir = file("C:/Program Files/Bookmap/lib")
def installedBookmapApiJars = files(
        new File(installedBookmapLibDir, "bm-l1api.jar"),
        new File(installedBookmapLibDir, "bm-simplified-api-wrapper.jar"),
)

def bookmapApiClasspath = {
    def installedFiles = installedBookmapApiJars.files
    if (installedFiles.every { it.exists() }) {
        return installedBookmapApiJars
    }
    return configurations.bookmapApi
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
    options.fork = true
    enabled = false
}

def mainClassesDir = layout.buildDirectory.dir("classes/java/main")
def testClassesDir = layout.buildDirectory.dir("classes/java/test")
def mainJavaSources = fileTree("src/main/java") { include "**/*.java" }
def testJavaSources = fileTree("src/test/java") { include "**/*.java" }

String javacExecutable() {
    def executableName = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "javac.exe" : "javac"
    return new File(System.getProperty("java.home"), "bin/${executableName}").absolutePath
}

tasks.register("verifyBookmapApiArtifacts") {
    doLast {
        def apiFiles = bookmapApiClasspath().files.collect { it.name }.sort()
        def installedNames = [
                "bm-l1api.jar",
                "bm-simplified-api-wrapper.jar",
        ].sort()
        def mavenNames = [
                "api-core-${bookmapApiVersion}.jar",
                "api-simplified-${bookmapApiVersion}.jar",
        ].sort()
        if (apiFiles != installedNames && apiFiles != mavenNames) {
            throw new GradleException("Expected installed Bookmap API jars ${installedNames} or Maven API artifacts ${mavenNames}, got ${apiFiles}")
        }
        logger.lifecycle("Using Bookmap API compile classpath: ${apiFiles}")
    }
}

tasks.register("compileJavaManual", Exec) {
    dependsOn tasks.named("verifyBookmapApiArtifacts")
    inputs.files(mainJavaSources, bookmapApiClasspath())
    outputs.dir(mainClassesDir)
    ignoreExitValue = true
    doFirst {
        mainClassesDir.get().asFile.mkdirs()
        commandLine(
                javacExecutable(),
                "-encoding", "UTF-8",
                "--release", "17",
                "-classpath", bookmapApiClasspath().asPath,
                "-d", mainClassesDir.get().asFile.absolutePath,
                *mainJavaSources.files.collect { it.absolutePath },
        )
    }
    doLast {
        def expected = new File(mainClassesDir.get().asFile, "com/mnq/bookmap/MnqWebSocketForwarder.class")
        if (!expected.exists()) {
            throw new GradleException("manual Java compile did not produce ${expected}")
        }
    }
}

tasks.register("compileTestJavaManual", Exec) {
    dependsOn tasks.named("compileJavaManual")
    inputs.files(mainJavaSources, testJavaSources, bookmapApiClasspath())
    outputs.dir(testClassesDir)
    ignoreExitValue = true
    doFirst {
        testClassesDir.get().asFile.mkdirs()
        commandLine(
                javacExecutable(),
                "-encoding", "UTF-8",
                "--release", "17",
                "-classpath", bookmapApiClasspath().asPath,
                "-d", testClassesDir.get().asFile.absolutePath,
                *mainJavaSources.files.collect { it.absolutePath },
                *testJavaSources.files.collect { it.absolutePath },
        )
    }
    doLast {
        def expected = new File(testClassesDir.get().asFile, "com/mnq/bookmap/TestRunner.class")
        if (!expected.exists()) {
            throw new GradleException("manual Java test compile did not produce ${expected}")
        }
    }
}

tasks.named("classes") {
    dependsOn tasks.named("compileJavaManual")
}

tasks.named("testClasses") {
    dependsOn tasks.named("compileTestJavaManual")
}

tasks.register("runBridgeTests", JavaExec) {
    dependsOn tasks.named("testClasses")
    classpath = files(testClassesDir.get().asFile, mainClassesDir.get().asFile, bookmapApiClasspath())
    mainClass = "com.mnq.bookmap.TestRunner"
}

test {
    dependsOn tasks.named("runBridgeTests")
    exclude "**/*"
}

shadowJar {
    dependsOn tasks.named("compileJavaManual")
    archiveBaseName.set("mnq-bookmap-forwarder")
    archiveVersion.set("")
    archiveClassifier.set("all")
    exclude "velox/**"
    mergeServiceFiles()
}

tasks.register("verifyShadowJarNoBookmapApiClasses") {
    doLast {
        def jarFile = tasks.named("shadowJar").get().archiveFile.get().asFile
        def veloxEntries = zipTree(jarFile).matching { include "velox/**/*.class" }.files
        if (!veloxEntries.empty) {
            throw new GradleException("Final add-on JAR must not contain Bookmap API classes, found ${veloxEntries.size()} velox class entries.")
        }
        logger.lifecycle("Verified final add-on JAR excludes Bookmap API velox classes.")
    }
}

tasks.named("shadowJar") {
    finalizedBy tasks.named("verifyShadowJarNoBookmapApiClasses")
}

jar {
    dependsOn tasks.named("compileJavaManual")
    exclude "velox/**"
}
